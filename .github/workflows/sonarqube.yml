name: SonarCloud Security Gate

on:
  pull_request:
    branches: ["develop"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarqube:
    name: "[quality] - SonarCloud scan + security gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: SonarCloud scan (waits for Quality Gate)
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

      - name: OWASP PR summary
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: vitalife-frontend
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/owasp_pr_summary.py > /tmp/owasp_summary.md
          if [ -s /tmp/owasp_summary.md ]; then
            gh pr comment "$PR_NUMBER" --edit-last --body-file /tmp/owasp_summary.md
          fi
