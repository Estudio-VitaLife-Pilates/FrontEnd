name: OWASP Security Summary

on:
  pull_request:
    branches: ["develop"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  owasp-summary:
    name: "[quality] - resumo de seguranca por categoria OWASP"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP PR summary
        continue-on-error: true
        env:
          SONAR_PROJECT_KEY: Estudio-VitaLife-Pilates_FrontEnd
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/owasp_pr_summary.py > /tmp/owasp_summary.md
          echo "--- owasp_summary.md ($(wc -c < /tmp/owasp_summary.md) bytes) ---"
          cat /tmp/owasp_summary.md
          if [ -s /tmp/owasp_summary.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/owasp_summary.md
          else
            echo "Arquivo vazio, nao ha o que comentar."
          fi
