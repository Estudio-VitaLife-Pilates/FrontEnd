name: Deploy frontend to Amazon ECR and EC2

on:
  push:
    branches: ["develop"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend/dev
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: "[deploy] - dev (ECR/EC2)"
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment script
        run: bash -n scripts/deploy-frontend.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS credentials
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to both web instances through Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          APP_PRIVATE_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=InstanciaApp-01" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          if [ -z "$APP_PRIVATE_IP" ] || [ "$APP_PRIVATE_IP" = "None" ]; then
            echo "The running app instance private IP was not found." >&2
            exit 1
          fi

          DEPLOY_SCRIPT_B64=$(gzip -c scripts/deploy-frontend.sh | base64 -w0)
          mapfile -t INSTANCE_IDS < <(
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=InstanciaWeb-01,InstanciaPub-Substitutiva-01" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text | tr '\t' '\n'
          )

          if [ "${#INSTANCE_IDS[@]}" -ne 2 ]; then
            echo "Expected two running web instances; found ${#INSTANCE_IDS[@]}." >&2
            printf '%s\n' "${INSTANCE_IDS[@]}" >&2
            exit 1
          fi

          for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
            echo "Deploying frontend image $IMAGE_TAG to $INSTANCE_ID"
            SSM_COMMAND="printf '%s' '$DEPLOY_SCRIPT_B64' | base64 --decode | gzip --decompress > /tmp/deploy-frontend.sh && chmod 700 /tmp/deploy-frontend.sh && /bin/bash /tmp/deploy-frontend.sh '$IMAGE_TAG' '$AWS_REGION' '$ECR_REGISTRY' '$APP_PRIVATE_IP'"
            PARAMETERS=$(jq -n --arg command "$SSM_COMMAND" '{commands: [$command]}')
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy frontend image $IMAGE_TAG" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text)

            for attempt in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              case "$STATUS" in
                Success)
                  echo "Frontend deployed successfully to $INSTANCE_ID."
                  break
                  ;;
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json
                  exit 1
                  ;;
              esac

              if [ "$attempt" -eq 120 ]; then
                echo "Timed out waiting for deployment on $INSTANCE_ID." >&2
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
              fi
              sleep 5
            done
          done
